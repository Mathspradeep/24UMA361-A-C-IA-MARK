const out=document.getElementById("out"),q=document.getElementById("q");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const m=v=>v==="AB"?'<span class="ab">AB</span>':v;
function row(label,mk,as,extra){
  const t=(mk==="AB"?0:mk)+as;
  return `<tr><td>${label}</td><td>${m(mk)}</td><td>${as}</td><td class="tot">${t}</td></tr>`;
}
function card(r){
  const [s,n,a1,b1,a2,b2]=r,rt=RETEST[s];
  const ia1=(a1==="AB"&&rt!=null)?rt:(a1==="AB"?0:a1);
  const ia2=a2==="AB"?0:a2;
  const t1=ia1+b1,t2=ia2+b2;
  const ini=n.split(" ").slice(0,2).map(w=>w[0]).join("");
  const pic=PH[s]?`<img class="pic" alt="${esc(n)}" src="data:image/jpeg;base64,${PH[s]}">`:`<div class="pic ini">${ini}</div>`;
  let h=`<div class="card"><div class="head">${pic}<div><div class="name">${esc(n)}</div><div class="reg">${PRE}${s}</div></div></div>
  <div class="scroll"><table><thead><tr><th>Test</th><th>Marks (60)</th><th>Assignment (40)</th><th>Total (100)</th></tr></thead><tbody>`;
  h+=row("IA1",a1,b1);
  if(rt!=null) h+=`<tr><td>IA1 Re-test</td><td>${rt}</td><td>${b1}</td><td class="tot">${rt+b1}</td></tr>`;
  h+=row("IA2",a2,b2);
  h+=`</tbody></table></div>`;
  h+=`<span class="avg">Average of IA1 &amp; IA2: ${((t1+t2)/2).toFixed(1)} / 100</span>`;
  if(rt!=null) h+=`<div class="note">Absent in IA1; re-test (IART1) mark of ${rt}/60 is used for the average.</div>`;
  else if(a1==="AB"||a2==="AB") h+=`<div class="note">AB = Absent. Total shown as in the official report (assignment marks only).</div>`;
  return h+`</div>`;
}
function render(){
  const v=q.value.trim().toLowerCase();
  if(!v){out.innerHTML='<div class="empty">Start typing to find a student.</div>';return}
  const res=D.filter(r=>(PRE+r[0]).toLowerCase().includes(v)||r[1].toLowerCase().includes(v));
  if(!res.length){out.innerHTML='<div class="empty">No student found.</div>';return}
  const shown=res.slice(0,10);
  out.innerHTML=shown.map(card).join("")+(res.length>10?`<div class="empty">Showing 10 of ${res.length} matches – refine your search.</div>`:"");
}
q.addEventListener("input",render);render();
</script>
